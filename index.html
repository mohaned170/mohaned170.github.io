<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Mondy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
::-webkit-scrollbar{display:none}html{scrollbar-width:none}
body{font-family:sans-serif;background:#000;color:#fff}
.top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;direction:ltr;background:linear-gradient(#000a,transparent)}
.top button{background:none;border:0;color:#fff;font-size:24px;cursor:pointer;width:34px}
.logo{font-family:Georgia,serif;letter-spacing:6px;font-size:22px;text-transform:uppercase}
.left{display:flex;gap:14px}
.hero{height:100vh;min-height:560px;background:#000 url(hero.jpg) center 40px/100% auto no-repeat;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:70px;text-align:center}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#000000dd);}
.hero *{position:relative;z-index:2}
.hero h2{font-family:Georgia,serif;font-weight:400;letter-spacing:3px;font-size:22px;margin-bottom:18px}
.btns{display:flex;gap:10px}
.btns a{background:#00d5ff;color:#000;text-decoration:none;width:128px;padding:20px 0;font-size:16px;text-align:center}
.sec{padding:40px 22px;max-width:640px;margin:auto}
.sec h3{font-family:Georgia,serif;font-weight:400;letter-spacing:4px;font-size:18px;margin-bottom:20px;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;padding:20px 4px;border-bottom:1px solid #ffffff30;color:#fff;text-decoration:none}
.row b{display:block;font-weight:400;font-size:17px}
.row small{color:#00d5ff;font-size:13px}
.row span{color:#00d5ff;font-size:22px}
.menu{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.menu.on{display:flex}
.menu a{color:#fff;text-decoration:none;font-size:22px;letter-spacing:1px}
.menu .x{position:absolute;top:16px;left:18px;background:none;border:0;color:#fff;font-size:30px}
#q{display:none;width:100%;padding:14px;background:#000;border:1px solid #fff;color:#fff;font-size:16px;margin-bottom:14px}
footer{text-align:center;color:#888;padding:30px;font-size:12px;letter-spacing:2px}
</style>
</head>
<body>
<div class="top">
<div class="left"><button id="mb">&#9776;</button><button id="sb">&#9906;</button></div>
<div class="logo">Mondy</div>
<div style="width:34px"></div>
</div>
<div class="menu" id="menu">
<button class="x" id="xb">&times;</button>
<a href="#lec">المحاضرات</a>
<a href="#groups">الجروبات</a>
</div>
<section class="hero">
<h2 style="font-size:30px;font-weight:700;margin-bottom:6px">Mondy</h2><p style="color:#00d5ff;margin-bottom:18px;letter-spacing:1px">مرجعك الأول للمحاضرات</p>
<div class="btns"><a href="#lec">المحاضرات</a><a href="#groups">الجروبات</a></div>
</section>
<div class="sec" id="lec">
<h3>LECTURES</h3>
<input id="q" placeholder="ابحث عن محاضرة">
<div id="list"></div>
</div>
<div class="sec" id="groups">
<h3>GROUPS</h3>
<div id="glist"></div>
</div>
<footer>MONDY</footer>
<script>
var subjects = [
  {name:"مبادئ قانون", files:[
    ["المحاضرة الثالثة", "مبادئ قانون", "المحاضرة_الثالثة_مبادئ_القانون__261015_000927.pdf"],
    ["المحاضرة السابعة", "نظرية الحق والأسئلة", "المحاضرة السابعة (نظرية الحق,والاسئلة الخاصة بها).pdf"],
    ["ملف إضافي", "مبادئ قانون", "print_job (6)_261030_111329.pdf"]
  ]},
  {name:"مبادئ اقتصاد", files:[
    ["الفصل الأول", "مبادئ اقتصاد", "الفصل الاول  مبادئ الاقتصاد _260930_010718.pdf"],
    ["الفصل الثالث", "مبادئ اقتصاد", "‎⁨الفصل_الثالث_مبادئ_الاقتصاد_⁩_261015_000938.pdf"],
    ["تدريبات الفصل الأول", "اقتصاد", "تدريبات الفصل الاول - اقتصاد_261015_000854.pdf"],
    ["تدريبات الفصل الثاني", "اقتصاد", "تدريبات الفصل الثاني - اقتصاد _261015_000902.pdf"]
  ]},
  {name:"محاسبة مالية", files:[
    ["المحاضرة الثالثة", "محاسبة مالية", "المحاضرة_الثالثة_المحاسبة_المالية__261015_000950.pdf"],
    ["محاضرة رقم 1", "محاسبة", "‎⁨محاسبه محاضره رقم 1⁩_260922_170639.pdf"]
  ]},
  {name:"إدارة أعمال", files:[

  ]},

  ]}
];
var box = document.getElementById("list");
var q=document.getElementById("q"),m=document.getElementById("menu");
var cur=-1;
function drawSubjects(){
  cur=-1; q.style.display="none"; box.innerHTML="";
  subjects.forEach(function(s,i){
    var a=document.createElement("a");
    a.className="row"; a.href="#lec";
    a.innerHTML='<div><b>'+s.name+'</b><small>'+s.files.length+' ملف</small></div><span>&#8250;</span>';
    a.onclick=function(e){e.preventDefault();drawFiles(i,"")};
    box.appendChild(a);
  });
}
function drawFiles(i,t){
  cur=i; var s=subjects[i]; box.innerHTML="";
  var back=document.createElement("a");
  back.className="row"; back.href="#lec";
  back.innerHTML='<div><b style="color:#00d5ff">&#8249; رجوع</b><small>'+s.name+'</small></div>';
  back.onclick=function(e){e.preventDefault();drawSubjects()};
  box.appendChild(back);
  var n=0;
  s.files.forEach(function(f){
    if(t && (f[0]+f[1]).indexOf(t)<0) return;
    n++;
    var a=document.createElement("a");
    a.className="row"; a.href=encodeURIComponent(f[2]);
    a.innerHTML='<div><b>'+f[0]+'</b><small>'+f[1]+'</small></div><span>&#8250;</span>';
    box.appendChild(a);
  });
  if(!n){var p=document.createElement("p");p.style.cssText="text-align:center;color:#888;padding:30px";p.textContent="لسه مفيش ملفات هنا";box.appendChild(p);}
}
drawSubjects();
q.oninput=function(){ if(cur>=0) drawFiles(cur,q.value); };
document.getElementById("sb").onclick=function(){ if(cur<0) drawFiles(0,""); q.style.display="block"; location.hash="lec"; q.focus(); };
document.getElementById("mb").onclick=function(){m.classList.add("on")};
document.getElementById("xb").onclick=function(){m.classList.remove("on")};
m.onclick=function(e){if(e.target.tagName=="A")m.classList.remove("on")};
var groups = [
  ["جروب الدفعة 1", "https://chat.whatsapp.com/LoKyqoYglVp8CTsbgMYCHM"],
  ["جروب الدفعة 2", "https://chat.whatsapp.com/BBdFgJfy7YQ4gtrPGwo5RI"],
  ["جروب الدفعة 3", "https://chat.whatsapp.com/KvMS8V7fkEeBR3zUJT85UF"],
  ["جروب الدفعة 4", "https://chat.whatsapp.com/CRaDTCkkfq09t0VTsIgAcK"]
];
var gb=document.getElementById("glist");
groups.forEach(function(g){
  var a=document.createElement("a");
  a.className="row";a.href=g[1];
  a.innerHTML='<div><b>'+g[0]+'</b><small>واتساب</small></div><span>&#8250;</span>';
  gb.appendChild(a);
});
var q=document.getElementById("q"),m=document.getElementById("menu");
q.oninput=function(){draw(q.value)};
document.getElementById("sb").onclick=function(){q.style.display="block";location.hash="lec";q.focus()};
document.getElementById("mb").onclick=function(){m.classList.add("on")};
document.getElementById("xb").onclick=function(){m.classList.remove("on")};
m.onclick=function(e){if(e.target.tagName=="A")m.classList.remove("on")};
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
