<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1f4d">
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f3f4f8;color:#222;padding-bottom:80px}
header{background:linear-gradient(135deg,#0b1f4d,#7a0f1e);color:#fff;padding:36px 20px 50px;text-align:center;border-radius:0 0 30px 30px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
header img{width:80px;height:80px;border-radius:20px;border:3px solid #fff;margin-bottom:10px}
header h1{font-size:28px}
header p{opacity:.9;margin-top:6px}
.sec{padding:20px}
.sec h2{margin-bottom:12px;color:#0b1f4d}
.card{display:flex;align-items:center;gap:14px;background:#fff;padding:16px;margin-bottom:12px;border-radius:16px;text-decoration:none;color:#222;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.ic{background:#7a0f1e;color:#fff;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.card b{display:block}
.card small{color:#888}
nav{position:fixed;bottom:0;left:0;right:0;background:#0b1f4d;display:flex;justify-content:space-around;padding:10px;box-shadow:0 -3px 12px rgba(0,0,0,.25)}
nav a{color:#fff;text-decoration:none;font-size:14px;text-align:center}
</style>
</head>
<body>
<header>
<img src="icon-192.png" alt="">
<h1 dir="ltr">Eng / Mohaned Barakat</h1>
<p>مرجعك الأول للمحاضرات والملفات</p>
</header>
<div class="sec">
<h2>المحاضرات</h2>
<div id="list"></div>
</div>
<div class="sec">
<h2>للتواصل</h2>
<a class="card" href="tel:01069200768"><div class="ic">📞</div><div><b>اتصل بنا</b><small>01069200768</small></div></a>
<a class="card" href="https://wa.me/201069200768"><div class="ic">💬</div><div><b>واتساب</b><small>01069200768</small></div></a>
</div>
<nav>
<a href="#">🏠<br>الرئيسية</a>
<a href="tel:01069200768">📞<br>اتصال</a>
</nav>
<script>
var files = [
  ["المحاضرة السابعة", "نظرية الحق والأسئلة", "المحاضرة السابعة (نظرية الحق,والاسئلة الخاصة بها).pdf"]
];
var box = document.getElementById("list");
files.forEach(function(f){
  var a = document.createElement("a");
  a.className = "card";
  a.href = encodeURIComponent(f[2]);
  a.innerHTML = '<div class="ic">📄</div><div><b>' + f[0] + '</b><small>' + f[1] + '</small></div>';
  box.appendChild(a);
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
